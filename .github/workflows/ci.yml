name: ci

# Validación en cada PR: compila el plugin, empaqueta y pasa el solution checker.
on:
  pull_request:
    branches: [main]

env:
  SOLUTION_NAME: AXZ_Core

jobs:
  validate:
    runs-on: windows-latest
    environment: dev   # los secrets viven en el environment, no a nivel de repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Compilar plugin
        run: dotnet build plugins/Axz.Plugins -c Release

      - name: Copiar DLL a la solución
        shell: pwsh
        run: |
          $dll  = Get-ChildItem plugins/Axz.Plugins/bin/Release -Recurse -Filter Axz.Plugins.dll | Select-Object -First 1
          $dest = Get-ChildItem solutions/$env:SOLUTION_NAME/src/PluginAssemblies -Recurse -Filter Axz.Plugins.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dest) { Copy-Item $dll.FullName $dest.FullName -Force } else { Write-Host "Aún no hay ensamblado registrado en la solución" }

      - uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Empaquetar managed
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/${{ env.SOLUTION_NAME }}/src
          solution-file: out/${{ env.SOLUTION_NAME }}.zip
          solution-type: Managed

      - name: Solution checker
        uses: microsoft/powerplatform-actions/check-solution@v1
        with:
          environment-url: ${{ secrets.ENV_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}
          path: out/${{ env.SOLUTION_NAME }}.zip
